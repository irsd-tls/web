  - type: people-card
    heading: Laundry/cleaning Service
    image: images/people/generic.png
    email: laverie.infinity-irsd@inserm.fr
    content: "The laundry/cleaning service, staffed by one person and shared between Infinity and IRSD, is primarily responsible for:"
    roles:
      - Collecting, sterilizing, and redistributing research team materials,
      - Sterilizing media and water bottles,
      - Collecting and autoclaving L2 waste for disposal,
      - Receiving, collecting, and distributing lab coats for L1 laboratories.
  - type: people-card
    heading: Hygiene and Safety
    image: images/people/generic.png
    name: Claude Watrin
    email: claude.watrin@inserm.fr
    content: "The Hygiene and Safety Department consists of Proximity Prevention Assistants (APP) and a Prevention Officer (CP), Claude Watrin. This shared position between CPTP and IRSD is responsible for:"
    roles:
      - Training new employees,
      - Promoting prevention within the center,
      - Conducting regulatory inspections.
