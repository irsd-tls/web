banner:
  enable: true
  contents: "Bienvenue à l’Institut de Recherche en Santé Digestive (IRSD)"
  button:
    contents: "En savoir plus"
    url: "about"
items:
  - type: highlights
    items_per_row: 3
    items:
    - title: Comprendre les mécanismes des maladies digestives
      icon: fa-cogs
      content: >
        Maladies inflammatoires chroniques de l’intestin, cancers digestifs, maladies métaboliques, etc.
    - title: Développer des innovations thérapeutiques
      icon: fa-microscope
      content: >
        Approches de pointe en biologie moléculaire, immunologie et microbiote.
    - title: Améliorer la prise en charge des patients
      icon: fa-stethoscope
      content: >
        Collaborations étroites avec les hôpitaux et les acteurs industriels.
  - type: heading
    heading: Recherche fondamentale, translationnelle et clinique dans le domaine des maladies digestives. 
    contents: >
      Nos équipes pluridisciplinaires, composées de chercheurs, cliniciens, biologistes et ingénieurs s’appuient sur des plateformes technologiques de haut niveau et des partenariats nationaux et internationaux pour accélérer les découvertes et leur application clinique.
  # - type: card
  #   heading: Qu'est-ce que les maladies digestives ?
  #   contents: >
  #     Les **maladies digestives** regroupent l’ensemble des troubles affectant le système digestif, qui comprend l’œsophage, l’estomac, les intestins, le foie, la vésicule biliaire et le pancréas. Elles peuvent être **inflammatoires** (comme la maladie de Crohn ou la rectocolite hémorragique), **fonctionnelles** (syndrome de l’intestin irritable), **infectieuses**, **métaboliques** (diabète, stéatose hépatique) ou **cancéreuses** (cancer colorectal, cancer du foie). 
