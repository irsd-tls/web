<!-- Open Street Map Static Map Shortcode -->
<!-- Bootatrap 5.3 -->
<div class="container" id="map-container-{{ .Get "id" }}" style="cursor: pointer;">
    <div class="container">
      <iframe src="{{ .Get "iframeSrc" }}" width="100%" height="450" frameborder="0" style="border:0" title="{{ .Get "mapTitle" }}" style="border: 1px solid black"></iframe>
    </div>
</div>
